name: Update Repo Metadata

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  repository: write

jobs:
  update-metadata:
    name: Update GitHub Repo Metadata
    runs-on: ubuntu-latest
    steps:
      - name: Update repository metadata
        uses: actions/github-script@v7
        with:
          script: |
            const currentYear = new Date().getFullYear();

            await github.rest.repos.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              description: 'A cross-platform TV streaming app built with Flutter — Apple TV, Android TV, mobile with IPTV live TV, VOD, favorites sync, and QR-code remote input.',
              homepage: 'https://github.com/poyhsiao/whiteTV',
              topics: [
                'flutter',
                'flutter-tvos',
                'apple-tv',
                'android-tv',
                'iptv',
                'streaming',
                'video-player',
                'tv-app',
                'fluttertv',
                'dart',
                'riverpod',
                'gorouter',
                'mediakit'
              ],
            });
            console.log('Repository metadata updated successfully');
