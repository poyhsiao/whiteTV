name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v0.10.17)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  android:
    name: Build Android/Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW" == v* ]]; then VER="${RAW:1}"; else VER="$RAW"; fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: |
          flutter build apk --release --target-platform android-arm64 || flutter build apk --release

      - name: Build Web
        run: |
          flutter build web --release

      - name: Upload Android/Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/web/**

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW" == v* ]]; then VER="${RAW:1}"; else VER="$RAW"; fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up code signing (CI, no-op)
        run: |
          mkdir -p ios/Runner
          echo "" > ios/Runner/FAKE_SIGNING

      - name: Build iOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          flutter build ios --release --no-codesign > build_ios.log 2>&1
          CODE=$?
          echo "Exit code: $CODE"
          cat build_ios.log | tail -20
          if [ -d build/ios/iphoneos ]; then
            cd build/ios
            zip -r "whitetv-${VERSION}-ios.zip" iphoneos
          fi
          if [ $CODE -ne 0 ]; then echo "Flutter build failed"; fi
          exit $CODE

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/whitetv-${{ env.VERSION }}-ios.zip

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build_ios.log

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW" == v* ]]; then VER="${RAW:1}"; else VER="$RAW"; fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build macos --release > build_macos.log 2>&1
          CODE=$?
          echo "Exit code: $CODE"
          cat build_macos.log | tail -20
          if [ $CODE -ne 0 ]; then echo "Flutter build failed"; fi
          exit $CODE

      - name: Create macOS DMG
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -d build/macos/Build/Products/Release ]; then
            cd build/macos/Build/Products/Release
            APP_NAME=$(ls *.app 2>/dev/null | head -1 || echo "")
            if [ -n "$APP_NAME" ]; then
              echo "Creating DMG from $APP_NAME"
              hdiutil create -volname "whiteTV-${VERSION}" -srcfolder "./$APP_NAME" -ov -format UDZO "../../../../whitetv-${VERSION}-macos.dmg"
            else
              echo "No .app found in Release folder"
              ls -la
            fi
          else
            echo "Release folder not found"
            ls -la build/macos/Build/Products/ 2>/dev/null || echo "Products folder missing"
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: build/whitetv-${{ env.VERSION }}-macos.dmg

      - name: Upload macOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build_macos.log

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW" == v* ]]; then VER="${RAW:1}"; else VER="$RAW"; fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Build Windows
        run: |
          flutter build windows --release > build_windows.log 2>&1
          CODE=$?
          echo "Exit code: $CODE"
          cat build_windows.log | tail -10
          exit $CODE

      - name: Package Windows
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          $src = "$PWD\build\windows\x64\runner\Release"
          $out = "$PWD\build\whitetv-$env:VERSION-windows.zip"
          Compress-Archive -Path "$src\*" -DestinationPath $out -Force
          $size = [math]::Round((Get-Item $out).Length / 1KB)
          Write-Host "Created: $out (${size} KB)"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: build/whitetv-${{ env.VERSION }}-windows.zip

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        shell: bash
        run: |
          RAW="${{ inputs.tag_name || github.ref_name }}"
          if [[ "$RAW" == v* ]]; then VER="${RAW:1}"; else VER="$RAW"; fi
          echo "VERSION=$VER" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev rpm fakeroot dpkg-dev libsecret-1-dev libasound2-dev libmpv-dev

      - name: Install dependencies
        run: flutter pub get

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter config --enable-linux-desktop
          flutter build linux --release > build_linux.log 2>&1
          CODE=$?
          echo "=== Flutter build exit code: $CODE ==="
          cat build_linux.log | tail -50
          exit $CODE

      - name: Create Linux tar.gz
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ ! -d build/linux/x64/release/bundle ]; then exit 0; fi
          cd build/linux/x64/release/bundle
          tar -czf "../../../../whitetv-${VER}-linux.tar.gz" .

      - name: Create Linux DEB
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ ! -d build/linux/x64/release/bundle ]; then exit 0; fi
          BUNDLE=build/linux/x64/release/bundle
          DEB_PKG=/tmp/deb-pkg
          rm -rf $DEB_PKG
          mkdir -p $DEB_PKG/DEBIAN
          mkdir -p $DEB_PKG/usr/local/bin
          cp -r $BUNDLE/* $DEB_PKG/usr/local/bin/
          VER=${VERSION#v}
          printf 'Package: whitetv\nVersion: %s\nSection: multimedia\nPriority: optional\nArchitecture: amd64\nMaintainer: whiteTV\nDescription: whiteTV App\n' "$VER" > $DEB_PKG/DEBIAN/control
          chmod 755 $DEB_PKG/DEBIAN/control
          dpkg-deb --build $DEB_PKG build/whitetv-${VERSION}-linux.deb

      - name: Create Linux RPM
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ ! -d build/linux/x64/release/bundle ]; then exit 0; fi
          BUNDLE=build/linux/x64/release/bundle
          RPM_PKG=/tmp/rpm-pkg
          rm -rf $RPM_PKG
          mkdir -p $RPM_PKG/BUILD
          mkdir -p $RPM_PKG/RPMS/x86_64
          mkdir -p $RPM_PKG/SPECS
          mkdir -p $RPM_PKG/SOURCES
          VER=${VERSION#v}
          ARCHIVE_NAME="whitetv-${VERSION}"
          mkdir -p $RPM_PKG/SOURCES/$ARCHIVE_NAME
          cp -r $BUNDLE/* $RPM_PKG/SOURCES/$ARCHIVE_NAME/
          printf 'Name: whitetv\nVersion: %s\nRelease: 1\nSummary: whiteTV App\nLicense: MIT\nURL: https://github.com/kimhsiao/whitetv\nBuildArch: x86_64\n\n' "$VER" > $RPM_PKG/SPECS/whitetv.spec
          printf '%%description\nwhiteTV App\n\n%%install\nmkdir -p %%{buildroot}/usr/local/bin\ncp -r %%{_builddir}/%s/* %%{buildroot}/usr/local/bin/\n\n%%files\n%%defattr(-,root,root)\n/usr/local/bin/*\n' "$ARCHIVE_NAME" >> $RPM_PKG/SPECS/whitetv.spec
          HOME=/tmp rpmbuild --define "_topdir $RPM_PKG" -bb $RPM_PKG/SPECS/whitetv.spec 2>&1 | tail -10
          ls $RPM_PKG/RPMS/x86_64/*.rpm 2>/dev/null && cp $RPM_PKG/RPMS/x86_64/*.rpm "build/whitetv-${VER}-linux.rpm" || echo "RPM may have failed"

      - name: Create Linux AppImage
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ ! -d build/linux/x64/release/bundle ]; then exit 0; fi
          BUNDLE=build/linux/x64/release/bundle
          mkdir -p /tmp/appdir/usr/bin
          cp -r $BUNDLE/* /tmp/appdir/usr/bin/
          printf '[Desktop Entry]\nName=whiteTV\nExec=whitetv\nType=Application\n' > /tmp/appdir/whitetv.desktop
          printf '#!/bin/bash\nexec "${APPDIR}/usr/bin/whitetv" "$@"\n' > /tmp/appdir/AppRun
          chmod +x /tmp/appdir/AppRun
          if [ ! -f ~/appimagetool ]; then
            wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O ~/appimagetool 2>/dev/null || true
            chmod +x ~/appimagetool 2>/dev/null || true
          fi
          if [ -f ~/appimagetool ]; then
            VERSION=$VERSION ~/appimagetool /tmp/appdir build/whitetv-${VER}-linux.AppImage 2>&1 | tail -5
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: |
            build/whitetv-${{ env.VERSION }}-linux.tar.gz
            build/whitetv-${{ env.VERSION }}-linux.deb
            build/whitetv-${{ env.VERSION }}-linux.rpm
            build/whitetv-${{ env.VERSION }}-linux.AppImage

      - name: Upload Linux build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build_linux.log

  release:
    name: Create Release
    needs: [android, ios, macos, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure
        run: find artifacts -type f | head -50

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
          files: |
            artifacts/android-web-artifacts/**/*.apk
            artifacts/android-web-artifacts/web/**
            artifacts/ios-artifact/*.zip
            artifacts/macos-artifact/*.dmg
            artifacts/windows-artifact/*.zip
            artifacts/linux-artifact/*.tar.gz
            artifacts/linux-artifact/*.deb
            artifacts/linux-artifact/*.rpm
            artifacts/linux-artifact/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name || github.ref }}
