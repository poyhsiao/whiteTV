name: Build Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v0.10.17). Defaults to latest main commit for workflow_dispatch.'
        required: false
        default: ''

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  android:
    name: Build Android/Web
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        if: inputs.tag_name != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Checkout main
        if: inputs.tag_name == ''
        uses: actions/checkout@v4

      - name: Extract version
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF#refs/tags/}" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Mobile/Pad APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/whitetv-${VERSION}-mobile.apk"

      - name: Build TV APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/whitetv-${VERSION}-tv.apk"

      - name: Build Web App
        run: flutter build web

      - name: Package web
        env:
          VERSION: ${{ env.VERSION }}
        run: cd build/web && tar -czf ../whitetv-${VERSION}-web.tgz .

      - name: Upload Android/Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            build/app/outputs/flutter-apk/whitetv-v*.apk
            build/whitetv-v*.tgz

  macos:
    name: Build macOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout tag
        if: inputs.tag_name != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Checkout main
        if: inputs.tag_name == ''
        uses: actions/checkout@v4

      - name: Extract version
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF#refs/tags/}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build macos --release
          cd build/macos/Release
          zip -r "../whitetv-${VERSION}-macos.zip" .
        working-directory: ${{ github.workspace }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: build/macos/whitetv-v*.zip

  ios:
    name: Build iOS
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - name: Checkout tag
        if: inputs.tag_name != ''
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name }}

      - name: Checkout main
        if: inputs.tag_name == ''
        uses: actions/checkout@v4

      - name: Extract version
        env:
          REF: ${{ github.ref }}
        run: echo "VERSION=${REF#refs/tags/}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build ios --release --no-codesign
          cd build/ios/iphoneos
          zip -r "../whitetv-${VERSION}-ios.zip" .
        working-directory: ${{ github.workspace }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/whitetv-v*.zip

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [android, macos, ios]
    steps:
      - name: Checkout (workflow ref = main)
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mv artifacts/android-web-artifacts/*.apk artifacts/ 2>/dev/null || true
          mv artifacts/android-web-artifacts/*.tgz artifacts/ 2>/dev/null || true
          mv artifacts/macos-artifact/*.zip artifacts/ 2>/dev/null || true
          mv artifacts/ios-artifact/*.zip artifacts/ 2>/dev/null || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
