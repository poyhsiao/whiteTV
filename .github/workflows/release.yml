name: Build Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v0.10.17)'
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  android:
    name: Build Android/Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release -v 2>&1 | tail -20
          mkdir -p build
          cp build/app/outputs/flutter-apk/app-release.apk build/whitetv-${VERSION}-mobile.apk

      - name: Build Android TV APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release --target-platform android-arm64 -v 2>&1 | tail -20 || true
          cp build/app/outputs/flutter-apk/app-release.apk build/whitetv-${VERSION}-tv.apk 2>/dev/null || cp build/whitetv-${VERSION}-mobile.apk build/whitetv-${VERSION}-tv.apk

      - name: Build Web
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build web
          tar -czf build/whitetv-${VERSION}-web.tgz -C build/web .

      - name: Upload Android/Web artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            build/whitetv-${{ env.VERSION }}-mobile.apk
            build/whitetv-${{ env.VERSION }}-tv.apk
            build/whitetv-${{ env.VERSION }}-web.tgz

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up code signing (CI, no-op)
        run: |
          mkdir -p ios/Runner
          echo "" > ios/Runner/FAKE_SIGNING

      - name: Build iOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          flutter build ios --release --no-codesign > build_ios.log 2>&1; CODE=$?
          echo "Exit code: $CODE"
          if [ -d build/ios/iphoneos ]; then
            mkdir -p build/ios/whitetv-${VERSION}-ios
            cp -r build/ios/iphoneos/* build/ios/whitetv-${VERSION}-ios/
            cd build/ios
            zip -r "whitetv-${VERSION}-ios.zip" whitetv-${VERSION}-ios
          fi
          exit $CODE

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/whitetv-${{ env.VERSION }}-ios.zip

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build_ios.log

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build macos --release > build_macos.log 2>&1; CODE=$?
          echo "Exit code: $CODE"
          if [ -d build/macos/Build/Products/Release ]; then
            cd build/macos/Build/Products/Release
            zip -r "../../../../whitetv-${VERSION}-macos.zip" . 2>/dev/null
          fi
          exit $CODE

      - name: Create macOS DMG
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -d build/macos/Build/Products/Release ]; then
            cd build/macos/Build/Products/Release
            # Create a DMG from the built app
            hdiutil create -volname "whiteTV-${VERSION}" -srcfolder . -ov -format UDZO "../../../../whitetv-${VERSION}-macos.dmg" 2>/dev/null || true
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: macos-artifact
          path: |
            build/whitetv-${{ env.VERSION }}-macos.dmg
            build/whitetv-${{ env.VERSION }}-macos.zip

  windows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/Pub/Cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter doctor || true
          flutter build windows --release > build_windows.log 2>&1; $CODE=$LASTEXITCODE
          Write-Host "Exit code: $CODE"
          if (Test-Path build/windows/runner/Release) {
            Compress-Archive -Path build/windows/runner/Release/* -DestinationPath "build/whitetv-${VERSION}-windows.zip" -Force
          }
          exit $CODE

      - name: Create Windows MSI
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if (Test-Path build/windows/runner/Release) {
            # Download and use candle to create MSI
            choco install wixtoolset -y 2>/dev/null || true
            $WIX="C:\Program Files (x86)\WiX Toolset v3.11\bin"
            if (Test-Path $WIX) {
              $env:PATH="$WIX;$env:PATH"
              & candle -nologo -ext WixUIExtension -ext WixUtilExtension -dVersion="${VERSION}" -dSourceDir="build/windows/runner/Release" -out "build/whitetv-${VERSION}-windows.msi" "windows-installer\Product.wxs" 2>/dev/null || true
            }
          }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: |
            build/whitetv-${{ env.VERSION }}-windows.zip
            build/whitetv-${{ env.VERSION }}-windows.msi

  linux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build clang pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev rpm fakeroot

      - name: Install dependencies
        run: flutter pub get

      - name: Build Linux
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build linux --release > build_linux.log 2>&1; CODE=$?
          echo "Exit code: $CODE"
          if [ -d build/linux/x64/release/bundle ]; then
            cd build/linux/x64/release/bundle
            tar -czf "../../../../whitetv-${VERSION}-linux.tar.gz" .
          fi
          exit $CODE

      - name: Create Linux DEB
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -d build/linux/x64/release/bundle ]; then
            mkdir -p /tmp/deb-pkg/DEBIAN
            mkdir -p /tmp/deb-pkg/usr/local/bin
            cp -r build/linux/x64/release/bundle/* /tmp/deb-pkg/usr/local/bin/
            cat > /tmp/deb-pkg/DEBIAN/control << EOF
Package: whitetv
Version: ${VERSION}
Section: multimedia
Priority: optional
Architecture: amd64
Maintainer: whiteTV
Description: whiteTV App
EOF
            dpkg-deb --build /tmp/deb-pkg build/whitetv-${VERSION}-linux.deb 2>/dev/null || true
          fi

      - name: Create Linux RPM
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -d build/linux/x64/release/bundle ]; then
            mkdir -p /tmp/rpm-pkg/BUILD
            mkdir -p /tmp/rpm-pkg/RPMS
            mkdir -p /tmp/rpm-pkg/SPECS
            cp -r build/linux/x64/release/bundle/* /tmp/rpm-pkg/BUILD/whitetv/
            cat > /tmp/rpm-pkg/SPECS/whitetv.spec << EOF
Name: whitetv
Version: ${VERSION}
Release: 1
Summary: whiteTV App
License: MIT
%description
whiteTV App
%install
mkdir -p %{buildroot}/usr/local/bin
cp -r /tmp/rpm-pkg/BUILD/whitetv/* %{buildroot}/usr/local/bin/
EOF
            rpmbuild --define "_topdir /tmp/rpm-pkg" -bb /tmp/rpm-pkg/SPECS/whitetv.spec 2>/dev/null || true
            cp /tmp/rpm-pkg/RPMS/x86_64/whitetv-*.rpm build/whitetv-${VERSION}-linux.rpm 2>/dev/null || true
          fi

      - name: Create Linux AppImage
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          if [ -d build/linux/x64/release/bundle ]; then
            # Download appimagetool if not cached
            if [ ! -f ~/appimagetool ]; then
              wget -q -O ~/appimagetool https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
              chmod +x ~/appimagetool
            fi
            mkdir -p /tmp/appimage/bundle
            cp -r build/linux/x64/release/bundle/* /tmp/appimage/bundle/
            cd /tmp/appimage
            VERSION=${VERSION} ~/appimagetool --appimage-extract-and-run bundle -w -s -n > /dev/null 2>&1 && \
              cp squashfs-root/whitetv*.AppImage build/whitetv-${VERSION}-linux.AppImage || true
          fi

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: linux-artifact
          path: |
            build/whitetv-${{ env.VERSION }}-linux.tar.gz
            build/whitetv-${{ env.VERSION }}-linux.deb
            build/whitetv-${{ env.VERSION }}-linux.rpm
            build/whitetv-${{ env.VERSION }}-linux.AppImage

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [android, ios, macos, windows, linux]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          set -e
          mkdir -p artifacts
          # Move all artifact files to a flat artifacts/ directory
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            for file in "$dir"*; do
              [ -f "$file" ] && mv "$file" artifacts/
            done
          done
          rm -rf artifacts/*/
          ls -la artifacts/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name || github.ref }}
