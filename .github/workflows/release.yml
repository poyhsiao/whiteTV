name: Build Release

'on':
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to build (e.g. v0.10.17)'
        required: true
        type: string

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  android:
    name: Build Android/Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name || github.ref }}" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build Mobile/Pad APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release --target-platform android-arm
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/whitetv-${VERSION}-mobile.apk"

      - name: Build TV APK
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter build apk --release --target-platform android-arm64
          cp build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/whitetv-${VERSION}-tv.apk"

      - name: Build Web App
        run: flutter build web

      - name: Package web
        env:
          VERSION: ${{ env.VERSION }}
        run: cd build/web && tar -czf ../whitetv-${VERSION}-web.tgz .

      - name: Upload Android/Web artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-web-artifacts
          path: |
            build/app/outputs/flutter-apk/whitetv-v*.apk
            build/whitetv-v*.tgz

  macos:
    name: Build macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name || github.ref }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Build macOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          flutter doctor || true
          flutter build macos --release --no-codesign 2>&1 | tee build_macos.log; CODE=${PIPESTATUS[0]}
          echo "PIPESTATUS: $CODE"
          ls -la build/macos/ 2>/dev/null || echo "No build/macos directory"
          if [ -d build/macos/Release ]; then
            cd build/macos/Release
            zip -r "../whitetv-${VERSION}-macos.zip" .
          fi
          exit $CODE

      - name: Upload macOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifact
          path: build/macos/whitetv-v*.zip

      - name: Upload macOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build_macos.log

  ios:
    name: Build iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Extract version
        run: echo "VERSION=${{ inputs.tag_name || github.ref }}" >> $GITHUB_ENV

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/flutter
          key: ${{ runner.os }}-flutter-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - name: Install dependencies
        run: flutter pub get

      - name: Set up code signing (CI, no-op)
        run: |
          mkdir -p ios/Runner
          echo "" > ios/Runner/FAKE_SIGNING

      - name: Build iOS
        env:
          VERSION: ${{ env.VERSION }}
        run: |
          sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer
          flutter build ios --release --no-codesign > build_ios.log 2>&1; CODE=$?
          echo "Exit code: $CODE"
          cat build_ios.log | tail -50
          if [ -d build/ios/iphonesimulator ]; then
            mkdir -p build/ios/whitetv-${VERSION}-ios
            cp -r build/ios/iphonesimulator/* build/ios/whitetv-${VERSION}-ios/
            cd build/ios
            zip -r "whitetv-${VERSION}-ios.zip" whitetv-${VERSION}-ios
          fi
          exit $CODE

      - name: Upload iOS artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ios-artifact
          path: build/ios/whitetv-v*.zip

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build_ios.log

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [android, macos]
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize artifacts
        run: |
          mv artifacts/android-web-artifacts/*.apk artifacts/ 2>/dev/null || true
          mv artifacts/android-web-artifacts/*.tgz artifacts/ 2>/dev/null || true
          mv artifacts/macos-artifact/*.zip artifacts/ 2>/dev/null || true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          draft: false
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.tag_name || github.ref }}
