name: Version Tagger

'on':
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version
        id: version
        run: |
          git fetch origin main

          CURRENT=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="${major}.${minor}.$((patch + 1))"

          # Check if tag already exists
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists, skipping"
            echo "version=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          sed -i "s/^version:.*/version: $NEW/" pubspec.yaml
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT -> $NEW"

      - name: Create commit and tag via API
        if: steps.version.outputs.version != 'skip'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage and commit
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION"

          # Get the commit SHA we just created
          COMMIT_SHA=$(git rev-parse HEAD)

          # Create tag via GitHub API so it registers as a user-created ref
          # This ensures release workflow is triggered (unlike GITHUB_TOKEN pushes)
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/git/refs \
            -d "{
              \"ref\": \"refs/tags/v$VERSION\",
              \"sha\": \"$COMMIT_SHA\"
            }"

          echo "Created tag v$VERSION at $COMMIT_SHA"

          # Push the commit (not the tag) to main
          # The tag push via API will trigger release workflow
          git push origin main
