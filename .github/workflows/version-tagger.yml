name: Version Tagger

'on':
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  create-tag:
    name: Create Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Bump version
        id: version
        run: |
          # Fetch and rebase to ensure we have the latest remote state
          git fetch origin main
          git rebase origin/main

          CURRENT=$(grep "^version:" pubspec.yaml | awk '{print $2}')
          IFS='.' read -r major minor patch <<< "$CURRENT"
          NEW="${major}.${minor}.$((patch + 1))"

          # Double-check: if remote already has this tag, skip
          if git rev-parse "v$NEW" >/dev/null 2>&1; then
            echo "Tag v$NEW already exists on remote, skipping"
            echo "version=skip" >> $GITHUB_OUTPUT
            exit 0
          fi

          sed -i "s/^version:.*/version: $NEW/" pubspec.yaml
          echo "version=$NEW" >> $GITHUB_OUTPUT
          echo "Bumping $CURRENT -> $NEW"

      - name: Commit and push tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ "$VERSION" == "skip" ]; then
            echo "Version bump skipped, no changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump version to $VERSION"
          git tag "v$VERSION"
          # Use force-with-lease to safely handle race conditions
          git push origin main --tags --force-with-lease
